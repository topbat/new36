<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .step { font-size: 14px; font-weight: 650; fill: #111827; }
    .sub { font-size: 11.5px; fill: #6b7280; }
    .label { font-size: 12px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="48" y="48" class="title">AI 谋略训练场 · 数据与决策链路</text>
  <text x="48" y="73" class="subtitle">先分离事实与推断，再检索证据、执行安全判断和条件化推演</text>

  <!-- Primary arrows behind nodes -->
  <path d="M210 170 L250 170" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M420 170 L460 170" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M630 170 L670 170" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M840 170 L888 170" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M1048 170 L1110 170 L1110 348 L1040 348" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M870 348 L830 348" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M660 348 L620 348" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M450 348 L410 348" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M240 348 L200 348" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <path d="M115 391 L115 500 L260 500" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M968 225 L968 260 L1102 260 C1102 248 1118 248 1118 260 L1140 260 L1140 450 L850 450 L850 500" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M745 391 L745 455 L580 455 L580 500" fill="none" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>

  <!-- Row 1 -->
  <rect x="40" y="127" width="170" height="86" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="125" y="157" text-anchor="middle" class="step">1　用户情境</text>
  <text x="125" y="181" text-anchor="middle" class="sub">预设案例 / 自述困境</text>
  <text x="125" y="199" text-anchor="middle" class="sub">学生 · 生活 · 职场</text>

  <rect x="250" y="127" width="170" height="86" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="335" y="157" text-anchor="middle" class="step">2　隐私过滤</text>
  <text x="335" y="181" text-anchor="middle" class="sub">识别姓名、联系方式</text>
  <text x="335" y="199" text-anchor="middle" class="sub">最小化保存</text>

  <rect x="460" y="127" width="170" height="86" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="545" y="157" text-anchor="middle" class="step">3　局势结构化</text>
  <text x="545" y="181" text-anchor="middle" class="sub">事实 · 未知 · 目标</text>
  <text x="545" y="199" text-anchor="middle" class="sub">资源 · 时间 · 风险</text>

  <rect x="670" y="127" width="170" height="86" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="755" y="157" text-anchor="middle" class="step">4　证据检索</text>
  <text x="755" y="181" text-anchor="middle" class="sub">计策内容 · 历史依据</text>
  <text x="755" y="199" text-anchor="middle" class="sub">条件 · 风险 · 反制</text>

  <polygon points="968,115 1048,170 968,225 888,170" fill="#fef2f2" stroke="#f87171" stroke-width="1.7"/>
  <text x="968" y="163" text-anchor="middle" class="step">5　安全判断</text>
  <text x="968" y="185" text-anchor="middle" class="sub">可继续推演？</text>

  <rect x="1058" y="136" width="62" height="26" rx="13" fill="#dcfce7"/>
  <text x="1089" y="154" text-anchor="middle" class="label" fill="#047857">通过</text>

  <!-- Row 2, read right to left -->
  <rect x="870" y="305" width="170" height="86" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="955" y="335" text-anchor="middle" class="step">6　候选策略</text>
  <text x="955" y="359" text-anchor="middle" class="sub">计策 / 沟通合作</text>
  <text x="955" y="377" text-anchor="middle" class="sub">暂不行动 + 成立条件</text>

  <rect x="660" y="305" width="170" height="86" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="745" y="335" text-anchor="middle" class="step">7　结构校验</text>
  <text x="745" y="359" text-anchor="middle" class="sub">固定 JSON 协议</text>
  <text x="745" y="377" text-anchor="middle" class="sub">失败一次修复重试</text>

  <rect x="450" y="305" width="170" height="86" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="535" y="335" text-anchor="middle" class="step">8　分支推演</text>
  <text x="535" y="359" text-anchor="middle" class="sub">短期结果 · 对方反应</text>
  <text x="535" y="377" text-anchor="middle" class="sub">二次影响 · 最坏风险</text>

  <rect x="240" y="305" width="170" height="86" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="325" y="335" text-anchor="middle" class="step">9　四维复盘</text>
  <text x="325" y="359" text-anchor="middle" class="sub">判断 · 有效 · 伦理</text>
  <text x="325" y="377" text-anchor="middle" class="sub">长期关系 · 替代方案</text>

  <rect x="30" y="305" width="170" height="86" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="115" y="335" text-anchor="middle" class="step">10　知识回流</text>
  <text x="115" y="359" text-anchor="middle" class="sub">相关展厅 · 反制方法</text>
  <text x="115" y="377" text-anchor="middle" class="sub">复盘卡 · 学习进度</text>

  <!-- Persistent stores and refusal path -->
  <path d="M260 500 C260 480 440 480 440 500 L440 582 C440 602 260 602 260 582 Z" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <ellipse cx="350" cy="500" rx="90" ry="20" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="350" y="535" text-anchor="middle" class="step">学习记录与审计</text>
  <text x="350" y="558" text-anchor="middle" class="sub">只保存必要数据与版本信息</text>
  <text x="350" y="578" text-anchor="middle" class="sub">事实 / 证据 / 推断分离</text>

  <rect x="740" y="500" width="220" height="100" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
  <text x="850" y="532" text-anchor="middle" class="step">安全停止</text>
  <text x="850" y="557" text-anchor="middle" class="sub">不继续生成策略步骤</text>
  <text x="850" y="577" text-anchor="middle" class="sub">说明边界与合适的求助方向</text>

  <rect x="470" y="500" width="220" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="532" text-anchor="middle" class="step">静态案例降级</text>
  <text x="580" y="557" text-anchor="middle" class="sub">模型失败或结构仍无效</text>
  <text x="580" y="577" text-anchor="middle" class="sub">继续提供已审核的学习内容</text>

  <!-- Legend -->
  <rect x="48" y="686" width="1104" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="72" y="714" class="label" fill="#475569">图例</text>
  <line x1="72" y1="739" x2="112" y2="739" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="124" y="743" class="sub">主处理链路</text>
  <line x1="270" y1="739" x2="310" y2="739" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="322" y="743" class="sub">证据读取 / 记录写入</text>
  <line x1="520" y1="739" x2="560" y2="739" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="572" y="743" class="sub">安全停止</text>
  <line x1="720" y1="739" x2="760" y2="739" stroke="#6b7280" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="772" y="743" class="sub">异常降级</text>
</svg>
